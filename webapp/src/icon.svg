<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="visorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="radarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />

  <!-- Radar Pulse Rings -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#38bdf8" stroke-width="2.5" opacity="0.25" stroke-dasharray="8 8" />
  <circle cx="256" cy="256" r="160" fill="none" stroke="#38bdf8" stroke-width="3" opacity="0.4" />
  <circle cx="256" cy="256" r="105" fill="none" stroke="#22d3ee" stroke-width="3.5" opacity="0.6" />

  <!-- Radar Sweep Cone -->
  <path d="M 256 256 L 390 120 A 190 190 0 0 0 256 66 Z" fill="url(#radarGrad)" opacity="0.4" />

  <!-- Motorcycle Helmet Graphic -->
  <g transform="translate(0, 15)">
    <!-- Helmet Main Shell -->
    <path d="M 170 330 C 130 330 110 280 120 220 C 135 140 190 120 270 120 C 350 120 395 160 400 230 C 405 290 380 330 350 330 C 330 330 315 310 290 310 C 265 310 250 330 170 330 Z" 
          fill="#1e293b" stroke="#f8fafc" stroke-width="10" stroke-linejoin="round" />

    <!-- Helmet Aerodynamic Ridge -->
    <path d="M 180 150 C 230 135 285 135 340 155" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" />

    <!-- Visor (Aerodynamic tinted shield) with glow -->
    <path d="M 230 185 C 310 185 365 205 375 250 C 365 275 320 285 240 285 C 215 285 195 270 190 250 C 185 210 205 185 230 185 Z" 
          fill="url(#visorGrad)" stroke="#7dd3fc" stroke-width="6" filter="url(#glow)" />

    <!-- Visor Reflection Highlight -->
    <path d="M 240 200 C 290 200 330 215 350 235" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.8" />

    <!-- Chin Guard Detail / Vents -->
    <rect x="220" y="298" width="16" height="6" rx="3" fill="#64748b" />
    <rect x="245" y="298" width="16" height="6" rx="3" fill="#64748b" />
    <rect x="270" y="298" width="16" height="6" rx="3" fill="#64748b" />
  </g>

  <!-- Weather Indicator Badge (Floating Top Right) -->
  <g transform="translate(340, 70)">
    <circle cx="45" cy="45" r="45" fill="#0f172a" stroke="#38bdf8" stroke-width="5" />
    <!-- Rain Cloud -->
    <path d="M 30 42 A 12 12 0 0 1 50 32 A 16 16 0 0 1 66 42 A 10 10 0 0 1 64 54 L 28 54 A 10 10 0 0 1 30 42 Z" fill="#60a5fa" />
    <!-- Rain Drops -->
    <line x1="34" y1="58" x2="30" y2="66" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
    <line x1="46" y1="58" x2="42" y2="66" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
    <line x1="58" y1="58" x2="54" y2="66" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- GPS Target Crosshair Point (Center) -->
  <circle cx="256" cy="270" r="7" fill="#10b981" filter="url(#glow)" />
</svg>

